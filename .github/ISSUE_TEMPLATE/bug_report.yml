name: Report a bug
description: Something does not start, does not connect, or behaves differently from the original
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [macOS (Apple Silicon), Windows 10 x64, Other]
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: How the game was launched
      options: [Installer / dmg, Portable exe, "npm run dev"]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Single player, Two players on one computer, Over the network - host, Over the network - client]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you pressed and what you saw (white screen, crash, freeze, desync, etc.). If you can, say how long the game had been running before the failure and on which level.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Game version
      description: Visible in the installer file name (for example, 0.1.0).
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: If the game's data folder contains `crash.log`, please attach it (the folders are listed in the "Saves" section of the README). A screenshot helps too.
    validations:
      required: false

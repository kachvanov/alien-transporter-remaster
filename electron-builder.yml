appId: local.alientransporter.remaster
productName: Alien Transporter Remaster
directories:
  buildResources: resources
  output: dist
files:
  - out/**
  - package.json
extraResources:
  - from: assets
    to: assets
    filter:
      - '**/*'
mac:
  target:
    - target: dmg
      arch: arm64
  identity: null
  # The system asks for access to the local network at the first LAN game (docs/03 §8); this is the text of the question.
  extendInfo:
    NSLocalNetworkUsageDescription: Alien Transporter uses the local network to find and join LAN games.
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64

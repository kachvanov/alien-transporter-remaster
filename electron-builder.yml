appId: local.alientransporter.remaster
productName: Alien Transporter Remaster
directories:
  buildResources: resources
  output: dist
afterPack: tools/build/adhocSign.cjs
files:
  - out/**
  - package.json
mac:
  # Everything: 1x (fallback), 2x and 3x (Retina).
  extraResources:
    - from: assets
      to: assets
      filter:
        - '**/*'
  target:
    - target: dmg
      arch: arm64
  category: public.app-category.games
  # resources/icon.icns is generated from the game art by tools/build/make-icon.ts (npm run build:mac).
  icon: icon.icns
  # BUILD_ID (short commit hash) is set by tools/build/builder.ts / dist-all.ts; electron-builder fails without it.
  artifactName: ${productName}-${version}-${env.BUILD_ID}-${arch}.${ext}
  # No Apple Developer ID: unsigned by electron-builder, ad-hoc signed by the afterPack hook below.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  # The system asks for access to the local network at the first LAN game (docs/03 §8); this is the text of the question.
  extendInfo:
    NSLocalNetworkUsageDescription: Alien Transporter uses the local network to find and join LAN games.
win:
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  # resources/icon.ico is generated from the game art by tools/build/make-icon.ts (npm run build:win).
  icon: icon.ico
  # Windows laptop (8 GB): only the 1x and 2x tiers (docs/05 section 9, T4.4). The 3x atlases (116 MB) stay out.
  extraResources:
    - from: assets
      to: assets
      filter:
        - '**/*'
        - '!gfx/3x/**'
  # "<productName> Setup <ver>-<hash>.exe" (installer) and "<productName> <ver>-<hash>.exe" (portable).
  artifactName: ${productName} ${version}-${env.BUILD_ID}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: ${productName} Setup ${version}-${env.BUILD_ID}.${ext}
